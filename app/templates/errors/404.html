{% extends "base.html" %}
{% block title %}No encontrado{% endblock %}
{% block content %}
<div class="error-page">
    <div class="error-page__codigo">404</div>
    <h1>No encontramos lo que buscas</h1>
    <p>Es posible que el enlace haya cambiado o que el registro ya no exista.</p>
    <a href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn--primary"><i data-lucide="arrow-left"></i> Volver al inicio</a>
</div>
{% endblock %}
